[package]
name = "yasc-desktop"
version = "0.1.0"
description = "Yes Another SSH Client desktop application"
authors = ["kewldan"]
edition = "2024"
rust-version = "1.85"
license = "Apache-2.0"

[lib]
name = "yasc_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
tauri = { version = "2.11.5", features = [] }
thiserror = "2"
tokio = { version = "1", features = ["io-util", "macros", "rt-multi-thread", "sync", "time"] }
uuid = { version = "1", features = ["v4"] }
yasc-domain = { path = "../../../crates/yasc-domain" }
yasc-platform = { path = "../../../crates/yasc-platform" }
yasc-ssh = { path = "../../../crates/yasc-ssh" }
yasc-storage = { path = "../../../crates/yasc-storage" }

[dev-dependencies]
tempfile = "3"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "deny"
