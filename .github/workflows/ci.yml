name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: Rust / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Install pinned Rust toolchain
        run: rustup show

      - name: Verify formatting
        run: cargo fmt --all --check

      - name: Lint workspace
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Probe Windows OpenSSH compatibility
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Get-Command ssh | Format-List Source, Version
          & ssh -V
          & ssh -G -F NUL -o StrictHostKeyChecking=yes -p 2200 -l integration example.com 2>&1 | Select-Object -First 20
          Write-Host "OpenSSH probe exit code: $LASTEXITCODE"
          exit 0

      - name: Test workspace
        run: cargo test --workspace --locked
