[workspace]
members = [
  "apps/cli",
  "crates/yasc-domain",
  "crates/yasc-platform",
  "crates/yasc-ssh",
  "crates/yasc-storage",
  "crates/yasc-vault",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "Apache-2.0"

[workspace.dependencies]
base64 = { version = "0.23.1", default-features = false, features = ["std"] }
clap = { version = "4.5", features = ["derive"] }
crossterm = "0.29"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["io-std", "io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }
uuid = { version = "1", features = ["serde", "v4"] }
yasc-domain = { path = "crates/yasc-domain" }
yasc-platform = { path = "crates/yasc-platform" }
yasc-ssh = { path = "crates/yasc-ssh" }
yasc-storage = { path = "crates/yasc-storage" }
yasc-vault = { path = "crates/yasc-vault" }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "deny"
